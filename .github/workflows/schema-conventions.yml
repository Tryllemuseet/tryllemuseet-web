name: Schema conventions

on:
  pull_request:
    paths:
      - 'schemaTypes/**'

jobs:
  check:
    name: Check isVisible + rich-text conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check schema conventions
        run: node scripts/check-schema-conventions.mjs
